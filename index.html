<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">
        <div class="logo">🔐</div>

        <h1>WELCOME</h1>
        <p>Secure Login System</p>

        <form id="loginForm">

            <input
                id="username"
                type="text"
                placeholder="Username"
                autocomplete="off"
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
            >

            <button type="submit">
                LOGIN
            </button>

            <div id="error"></div>

        </form>

        <small>Restricted Access</small>
    </div>

    <div id="jumpscare">
        <img src="ghost.png" alt="Ghost">
    </div>

    <audio id="scream" src="scream.mp3"></audio>

    <script src="js/script.js"></script>

</body>
</html>
